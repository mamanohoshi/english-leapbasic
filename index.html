<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英単語マスター</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #F8FAFC;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #FFFFFF;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            box-sizing: border-box;
            min-height: 560px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        h1, h2 { text-align: center; color: #1E293B; margin-top: 0; }
        
        /* 基本ボタン（共通ベース） */
        .btn {
            color: white;
            border: none !important;
            padding: 16px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: bold;
            width: 100%;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn:active {
            transform: scale(0.98);
        }

        /* トップページ用：シアン系ボタン */
        .btn-primary {
            background: linear-gradient(180deg, #0891B2 0%, #06B6D4 100%);
            box-shadow: 0 6px 16px rgba(6, 182, 212, 0.3);
        }

        /* トップページ用：落ち着いたダークパープル系ボタン */
        .btn-purple {
            background: linear-gradient(180deg, #4C1D95 0%, #5B21B6 100%);
            box-shadow: 0 6px 16px rgba(76, 29, 149, 0.25);
        }

        /* 汎用アクションボタン（次へ進む等） */
        .btn-dark {
            background: linear-gradient(180deg, #334155 0%, #1E293B 100%);
            box-shadow: 0 6px 16px rgba(30, 41, 59, 0.2);
        }

        /* 4択ボタン */
        .btn-option {
            background: #E2E8F0; 
            color: #334155;
            text-align: left;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
            margin-bottom: 12px;
            line-height: 1.4;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            box-sizing: border-box;
        }
        .btn-option:active {
            transform: scale(0.98);
        }

/* わからないボタン（選択肢と明確に区別する破線・パス風デザイン） */
    .btn-unknown {
        width: 100%;
        box-sizing: border-box;
        background: #F8FAFC;                        /* 選択肢より少し明るく清潔感のある背景 */
        color: #64748B;                             /* 落ち着いたスレートグレーで主張を抑える */
        text-align: center;                         /* 操作ボタンらしく中央寄せ */
        padding: 16px;
        font-size: 16px;                            /* 選択肢(18px)よりほんの少し小さくして補助感を出す */
        font-weight: bold;
        border: 2px dashed #CBD5E1;                 /* ★破線の枠線で「スキップ・パス感」を表現 */
        border-radius: 16px;
        box-shadow: none;                           /* 影を消して選択肢との立体感の差を出す */
        margin-top: 20px;                           /* 4択ボタンとの間隔を少し広げて離す */
        line-height: 1.4;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
    }

    /* タップ・押下時 */
    .btn-unknown:active {
        transform: scale(0.98);
        background-color: #E2E8F0;
    }

    /* 非活性時（連打防止中） */
    .btn-unknown:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
        }

        /* 正解のボタン */
        .btn-option.correct-choice {
            background: #E2E8F0 !important;
            color: #334155 !important;
            border: 3px solid #22C55E !important;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.2) !important;
        }

        /* 間違えたボタン */
        .btn-option.wrong-choice {
            background: #E2E8F0 !important;
            color: #334155 !important;
            border: 3px solid #EF4444 !important;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2) !important;
        }

        /* ヘッダー周り */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .btn-abort {
            background: #E2E8F0;
            color: #64748B;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-abort:active {
            background: #CBD5E1;
        }

        .word-display {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin: 15px 0 25px 0;
            color: #1E293B;
        }
        .hint-display {
            font-size: 22px;
            letter-spacing: 2px;
            color: #64748B;
            text-align: center;
            margin-bottom: 15px;
        }
        input[type="text"] {
            width: 100%;
            padding: 16px;
            font-size: 20px;
            border: 2px solid #E2E8F0;
            border-radius: 12px;
            box-sizing: border-box;
            margin-bottom: 20px;
            text-align: center;
        }
        select {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border-radius: 12px;
            border: 2px solid #E2E8F0 !important;
            margin-bottom: 24px;
            background-color: #fff;
        }
        .progress {
            font-size: 15px;
            color: #94A3B8;
            font-weight: bold;
        }
        .result-msg {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            color: #1E293B;
            margin: 20px 0;
            white-space: pre-wrap;
        }

        /* 判定表示エリア */
        .feedback-area {
            text-align: center;
            padding: 15px;
            border-radius: 16px;
            margin-top: 10px;
            margin-bottom: 15px;
        }
        .correct {
            background-color: #F0FDF4;
            color: #15803D;
            font-size: 20px;
            font-weight: bold;
        }
        .incorrect {
            background-color: #FEF2F2;
            color: #B91C1C;
            font-size: 16px;
            font-weight: bold;
        }
        .is-hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. 設定・学習開始画面 -->
    <div id="screen-setup">
        <h1>英単語マスター</h1>
        <p style="text-align: center; color: #64748B; margin-bottom: 20px;">学習する単元を選んでください</p>
        
        <select id="unit-select">
            <option value="">読み込み中...</option>
        </select>

        <button class="btn btn-primary" onclick="startQuiz('choice')">4択クイズを始める</button>
        <button class="btn btn-purple" onclick="startQuiz('input')">スペル入力で覚える</button>
    </div>

    <!-- 2. クイズ画面 -->
    <div id="screen-quiz" class="is-hidden">
        <div>
            <div class="quiz-header">
                <span class="progress" id="quiz-progress">1 / 10</span>
                <button class="btn-abort" onclick="confirmAbort()">中断</button>
            </div>
            <div class="word-display" id="question-text">---</div>
            <div class="hint-display" id="hint-text"></div>
        </div>

        <!-- 4択回答エリア -->
        <div id="choice-area">
            <button class="btn-option" id="opt0" onclick="checkChoice(0)"></button>
            <button class="btn-option" id="opt1" onclick="checkChoice(1)"></button>
            <button class="btn-option" id="opt2" onclick="checkChoice(2)"></button>
            <button class="btn-option" id="opt3" onclick="checkChoice(3)"></button>
            
        <!-- ★追加：わからないボタン -->
            <button class="btn-unknown" id="btn-dont-know" onclick="handleDontKnow()">パス（わからない）</button>
        </div>

        <!-- キーボード入力回答エリア -->
        <div id="input-area" class="is-hidden">
            <input type="text" id="user-input" placeholder="英単語を入力" autocomplete="off" autocapitalize="none">
            <button class="btn btn-dark" id="submit-input-btn" onclick="checkInput()">回答する</button>
        </div>

        <!-- 正解/不正解フィードバック -->
        <div id="feedback-area" class="feedback-area is-hidden">
            <div id="feedback-text"></div>
            <button class="btn btn-dark" style="margin-top: 15px; margin-bottom: 0;" onclick="nextQuestion()">次へ進む</button>
        </div>
    </div>

    <!-- 3. 結果画面 -->
    <div id="screen-result" class="is-hidden">
        <h2>学習結果</h2>
        <div class="word-display" id="score-text">0 / 10 問正解</div>
        <div class="result-msg" id="cheer-message"></div>
        <button class="btn btn-primary" onclick="showSetup()">もう一度挑戦する</button>
    </div>
</div>

<script>
const JSON_URL = 'https://raw.githubusercontent.com/mamanohoshi/english-leapbasic/main/Word.json';

let wordBank = {};
let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let currentMode = '';

window.addEventListener('DOMContentLoaded', async () => {
    try {
        const response = await fetch(JSON_URL);
        if (!response.ok) throw new Error('ネットワークエラー');
        const data = await response.json();
        
        // JSONが配列形式かオブジェクト形式かに対応
        if (Array.isArray(data)) {
            wordBank = { "すべての単語": data };
        } else {
            wordBank = data;
        }

        const selectEl = document.getElementById('unit-select');
        selectEl.innerHTML = '';
        
        Object.keys(wordBank).forEach(unitKey => {
            const opt = document.createElement('option');
            opt.value = unitKey;
            opt.innerText = unitKey;
            selectEl.appendChild(opt);
        });
    } catch (error) {
        alert('単語データの読み込みに失敗しました。URLまたはJSONの記述を確認してください。');
        console.error(error);
    }
});

// 堅牢なシャッフル処理（Fisher-Yatesアルゴリズム）
function shuffleArray(array) {
    const clone = [...array];
    for (let i = clone.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [clone[i], clone[j]] = [clone[j], clone[i]];
    }
    return clone;
}

function showSetup() {
    document.getElementById('screen-setup').classList.remove('is-hidden');
    document.getElementById('screen-quiz').classList.add('is-hidden');
    document.getElementById('screen-result').classList.add('is-hidden');
}

function confirmAbort() {
    if (confirm("学習を中断してトップ画面に戻りますか？")) {
        showSetup();
    }
}

function startQuiz(mode) {
    currentMode = mode;
    const selectedUnit = document.getElementById('unit-select').value;
    
    // データが存在するかチェック
    if (!wordBank[selectedUnit] || wordBank[selectedUnit].length === 0) {
        alert('選択された単元のデータが存在しません。');
        return;
    }

    // idや構造が崩れている無効なデータをあらかじめ除外（安全対策）
    const validWords = wordBank[selectedUnit].filter(item => item && (item.word || item.english || item.id));

    // データが足りない場合のチェック
    if (validWords.length === 0) {
        alert('有効な単語データが見つかりませんでした。');
        return;
    }

    // 完全ランダムシャッフルして10問（データ数が10未満ならその全件）を取得
    currentQuestions = shuffleArray(validWords).slice(0, 10);
    currentIndex = 0;
    score = 0;

    document.getElementById('screen-setup').classList.add('is-hidden');
    document.getElementById('screen-quiz').classList.remove('is-hidden');

    loadQuestion();
}

function loadQuestion() {
    document.getElementById('feedback-area').classList.add('is-hidden');
    document.getElementById('hint-text').textContent = '';
    
    const q = currentQuestions[currentIndex];
    const wordText = q.word || q.en;
    const meaningText = q.meaning || q.jp;

    document.getElementById('quiz-progress').textContent = `${currentIndex + 1} / ${currentQuestions.length}`;

    if (currentMode === 'choice') {
        document.getElementById('choice-area').classList.remove('is-hidden');
        document.getElementById('input-area').classList.add('is-hidden');
        document.getElementById('question-text').textContent = wordText;
        
        const allWords = Object.values(wordBank).flat();
        const otherJps = allWords
            .filter(item => (item.meaning || item.jp) !== meaningText)
            .map(item => item.meaning || item.jp);
        
        // 修正: shuffle -> shuffleArray
        const wrongChoices = shuffleArray(otherJps).slice(0, 3);
        const options = shuffleArray([meaningText, ...wrongChoices]);

        for (let i = 0; i < 4; i++) {
            const btn = document.getElementById(`opt${i}`);
            btn.textContent = options[i] || "---";
            btn.disabled = false;
            btn.className = "btn-option";
            btn.dataset.correct = (options[i] === meaningText);
        }
    } else {
        document.getElementById('choice-area').classList.add('is-hidden');
        document.getElementById('input-area').classList.remove('is-hidden');
        document.getElementById('submit-input-btn').classList.remove('is-hidden');
        document.getElementById('question-text').textContent = meaningText;
        
        const hint = wordText.split(' ').map(word => {
            // 2文字目までを取り出して、残りを「_」にする
            const prefix = word.slice(0, 2);
            const blanks = '_'.repeat(Math.max(0, word.length - 2));
            return prefix + blanks;
        }).join(' ');

        document.getElementById('hint-text').textContent = hint;
        document.getElementById('user-input').value = '';
        document.getElementById('user-input').disabled = false;
    }
}
    
function showFeedback(isCorrect, answerText) {
    const feedbackArea = document.getElementById('feedback-area');
    const feedbackText = document.getElementById('feedback-text');
    
    feedbackArea.classList.remove('is-hidden');
    
    if (isCorrect) {
        score++;
        feedbackArea.className = "feedback-area correct";
        feedbackText.innerText = "⭕ 正解！";
    } else {
        feedbackArea.className = "feedback-area incorrect";
        feedbackText.innerText = `❌ 残念...\n\n正解： ${answerText}`;
    }
}

// ------------------------------------
// 4択ボタンが押された時の判定
// ------------------------------------
    
function checkChoice(selectedIndex) {
    const selectedBtn = document.getElementById(`opt${selectedIndex}`);
    const isCorrect = selectedBtn.dataset.correct === "true";
    const q = currentQuestions[currentIndex];
    const meaningText = q.meaning || q.jp;
    
    for (let i = 0; i < 4; i++) {
        const btn = document.getElementById(`opt${i}`);
        btn.disabled = true;
        
        btn.classList.add('disabled-option');
        
        if (btn.dataset.correct === "true") {
            btn.classList.remove('disabled-option');
            btn.classList.add('correct-choice');
        } 
        else if (i === selectedIndex && !isCorrect) {
            btn.classList.remove('disabled-option');
            btn.classList.add('wrong-choice');
        }
    }
    
    showFeedback(isCorrect, meaningText);
}

// 「わからない」ボタンが押された時の処理（安全版）
function handleDontKnow() {
    // 1. 選択肢と「わからない」ボタンを無効化（連打防止）
    const options = document.querySelectorAll('.btn-option');
    options.forEach(btn => btn.disabled = true);
    const dontKnowBtn = document.getElementById('btn-dont-know');
    if (dontKnowBtn) dontKnowBtn.disabled = true;

    // 2. 現在の問題データを取得
    const currentQ = currentQuestions[currentIndex];
    const feedbackText = document.getElementById('feedback-text');

    // 3. 一度表示をクリアして、安全な要素（textContent）で組み立て
    feedbackText.innerHTML = '';

    const headerDiv = document.createElement('div');
    headerDiv.style.color = '#ea580c';
    headerDiv.style.fontWeight = 'bold';
    headerDiv.style.fontSize = '1.1rem';
    headerDiv.style.marginBottom = '8px';
    headerDiv.textContent = 'パスしました';

    const bodyDiv = document.createElement('div');
    bodyDiv.textContent = '正解は ';
    const strongEl = document.createElement('strong');
    strongEl.textContent = `「${currentQ.meaning || currentQ.jp}」`;
    bodyDiv.appendChild(strongEl);
    bodyDiv.appendChild(document.createTextNode(' です'));

    feedbackText.appendChild(headerDiv);
    feedbackText.appendChild(bodyDiv);

    // 4. 4択エリアを隠し、フィードバックエリアを表示
    document.getElementById('choice-area').classList.add('is-hidden');
    document.getElementById('feedback-area').classList.remove('is-hidden');
}

function checkInput() {
    const userAns = document.getElementById('user-input').value.trim().toLowerCase();
    const q = currentQuestions[currentIndex];
    const targetAns = (q.word || q.en).toLowerCase();
    const isCorrect = (userAns === targetAns);
    
    document.getElementById('user-input').disabled = true;
    document.getElementById('submit-input-btn').classList.add('is-hidden');
    
    showFeedback(isCorrect, q.word || q.en);
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex < currentQuestions.length) {
        // 次の問題へ進むため「わからない」ボタンを有効に戻す
        const dontKnowBtn = document.getElementById('btn-dont-know');
        if (dontKnowBtn) dontKnowBtn.disabled = false;

        loadQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById('screen-quiz').classList.add('is-hidden');
    document.getElementById('screen-result').classList.remove('is-hidden');
    
    document.getElementById('score-text').innerText = `${score} / ${currentQuestions.length} 問正解`;

    let cheer = "";
    if (score === 10) {
        cheer = "パーフェクト！🎉\n電車のスキマ時間で天才になっちゃうね！";
    } else if (score >= 7) {
        cheer = "すごい！高得点！👏\nこの調子でどんどん復習しよう！";
    } else if (score >= 4) {
        cheer = "ナイストライ！👍\n繰り返しやれば絶対に覚えられるよ！";
    } else {
        cheer = "ファイト！継続が一番大事！💪\nもう一回チャレンジしてみよう！";
    }
    document.getElementById('cheer-message').innerText = cheer;
}
</script>
</body>
</html>
