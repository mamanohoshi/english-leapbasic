<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英単語マスター</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #F8FAFC;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #FFFFFF;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            box-sizing: border-box;
            min-height: 560px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        h1, h2 { text-align: center; color: #1E293B; margin-top: 0; }
        
        /* 基本ボタン（共通ベース） */
        .btn {
            color: white;
            border: none !important;
            padding: 16px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: bold;
            width: 100%;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn:active {
            transform: scale(0.98);
        }

        /* トップページ用：シアン系ボタン */
        .btn-primary {
            background: linear-gradient(180deg, #0891B2 0%, #06B6D4 100%);
            box-shadow: 0 6px 16px rgba(6, 182, 212, 0.3);
        }

        /* トップページ用：落ち着いたダークパープル系ボタン */
        .btn-purple {
            background: linear-gradient(180deg, #4C1D95 0%, #5B21B6 100%);
            box-shadow: 0 6px 16px rgba(76, 29, 149, 0.25);
        }

        /* 汎用アクションボタン（次へ進む等） */
        .btn-dark {
            background: linear-gradient(180deg, #334155 0%, #1E293B 100%);
            box-shadow: 0 6px 16px rgba(30, 41, 59, 0.2);
        }

        /* 4択ボタン（グレー背景：#E2E8F0 / 文字色：濃いチャコール #334155） */
        .btn-option {
            background: #E2E8F0; 
            color: #334155; /* チャコール */
            text-align: left;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
            margin-bottom: 20px;
            line-height: 1.4;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-option:active {
            transform: scale(0.98);
        }

        /* 解答後：未選択の選択肢 */
        .btn-option.disabled-option {
            background: #E2E8F0 !important;
            color: #334155 !important;
            box-shadow: none !important;
            border: none !important;
        }

        /* 正解のボタン（背景色は変えず緑枠のみ追加） */
        .btn-option.correct-choice {
            background: #E2E8F0 !important;
            color: #334155 !important;
            border: 3px solid #22C55E !important;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.2) !important;
        }

        /* 間違えたボタン（背景色は変えず赤枠のみ追加） */
        .btn-option.wrong-choice {
            background: #E2E8F0 !important;
            color: #334155 !important;
            border: 3px solid #EF4444 !important;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2) !important;
        }

        /* ヘッダー周り（進捗と中断ボタン） */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .btn-abort {
            background: #E2E8F0;
            color: #64748B;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-abort:active {
            background: #CBD5E1;
        }

        .word-display {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin: 15px 0 25px 0;
            color: #1E293B;
        }
        .hint-display {
            font-size: 22px;
            letter-spacing: 2px;
            color: #64748B;
            text-align: center;
            margin-bottom: 15px;
        }
        input[type="text"] {
            width: 100%;
            padding: 16px;
            font-size: 20px;
            border: 2px solid #E2E8F0;
            border-radius: 12px;
            box-sizing: border-box;
            margin-bottom: 20px;
            text-align: center;
        }
        select {
            border: 2px solid #E2E8F0 !important;
        }
        .progress {
            font-size: 15px;
            color: #94A3B8;
            font-weight: bold;
        }
        .result-msg {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            color: #1E293B;
            margin: 20px 0;
            white-space: pre-wrap;
        }

        /* 判定表示エリア */
        .feedback-area {
            text-align: center;
            padding: 15px;
            border-radius: 16px;
            margin-top: 10px;
        }
        .correct {
            background-color: #F0FDF4;
            color: #15803D;
            font-size: 22px;
            font-weight: bold;
        }
        .incorrect {
            background-color: #FEF2F2;
            color: #B91C1C;
            font-size: 18px;
            font-weight: bold;
        }
        .is-hidden {
            display: none !important;
        }
    </style>
</head>
<script>
// ★自身の Raw URL に差し替え済
const JSON_URL = 'https://github.com/mamanohoshi/english-leapbasic/blob/main/Word.json';

let wordBank = {};
let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let currentMode = '';

// ページ読み込み時に GitHub から JSON を自動取得する
window.addEventListener('DOMContentLoaded', async () => {
    try {
        const response = await fetch(JSON_URL);
        if (!response.ok) throw new Error('ネットワークエラー');
        wordBank = await response.json();
        
        // 単元選択セレクトボックスを JSON データに基づいて動的生成
        const selectEl = document.getElementById('unit-select');
        selectEl.innerHTML = ''; // 初期選択肢をクリア
        
        Object.keys(wordBank).forEach(unitKey => {
            const opt = document.createElement('option');
            opt.value = unitKey;
            opt.innerText = unitKey; // 例: PassVocab_Part1
            selectEl.appendChild(opt);
        });
    } catch (error) {
        alert('単語データの読み込みに失敗しました。URLまたはJSONの記述を確認してください。');
        console.error(error);
    }
});

function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}

function showSetup() {
    document.getElementById('screen-setup').classList.remove('is-hidden');
    document.getElementById('screen-quiz').classList.add('is-hidden');
    document.getElementById('screen-result').classList.add('is-hidden');
}

function confirmAbort() {
    if (confirm("学習を中断してトップ画面に戻りますか？")) {
        showSetup();
    }
}

function startQuiz(mode) {
    currentMode = mode;
    const selectedUnit = document.getElementById('unit-select').value;
    
    if (!wordBank[selectedUnit] || wordBank[selectedUnit].length === 0) {
        alert('選択された単元のデータが存在しません。');
        return;
    }

    currentQuestions = shuffle([...wordBank[selectedUnit]]).slice(0, 10);
    currentIndex = 0;
    score = 0;

    document.getElementById('screen-setup').classList.add('is-hidden');
    document.getElementById('screen-quiz').classList.remove('is-hidden');

    loadQuestion();
}

function loadQuestion() {
    document.getElementById('feedback-area').classList.add('is-hidden');
    
    const q = currentQuestions[currentIndex];
    document.getElementById('quiz-progress').innerText = `${currentIndex + 1} / ${currentQuestions.length}`;

    if (currentMode === 'choice') {
        document.getElementById('choice-area').classList.remove('is-hidden');
        document.getElementById('input-area').classList.add('is-hidden');
        document.getElementById('question-text').innerText = q.en;
        
        const allWords = Object.values(wordBank).flat();
        const otherJps = allWords.filter(item => item.jp !== q.jp).map(item => item.jp);
        const wrongChoices = shuffle(otherJps).slice(0, 3);
        
        const options = shuffle([q.jp, ...wrongChoices]);
        for (let i = 0; i < 4; i++) {
            const btn = document.getElementById(`opt${i}`);
            btn.innerText = options[i] || "---";
            btn.disabled = false;
            btn.className = "btn btn-option";
            btn.dataset.correct = (options[i] === q.jp);
        }
    } else {
        document.getElementById('choice-area').classList.add('is-hidden');
        document.getElementById('input-area').classList.remove('is-hidden');
        document.getElementById('submit-input-btn').classList.remove('is-hidden');
        document.getElementById('question-text').innerText = q.jp;
        
        const hint = q.en.split(' ').map(word => {
            return word[0] + '_'.repeat(word.length - 1);
        }).join(' ');
        
        document.getElementById('hint-text').innerText = hint;
        document.getElementById('user-input').value = '';
        document.getElementById('user-input').disabled = false;
    }
}

function showFeedback(isCorrect, answerText) {
    const feedbackArea = document.getElementById('feedback-area');
    const feedbackText = document.getElementById('feedback-text');
    
    feedbackArea.classList.remove('is-hidden');
    
    if (isCorrect) {
        score++;
        feedbackArea.className = "feedback-area correct";
        feedbackText.innerText = "⭕ 正解！";
    } else {
        feedbackArea.className = "feedback-area incorrect";
        feedbackText.innerText = `❌ 残念...\n\n正解： ${answerText}`;
    }
}

function checkChoice(selectedIndex) {
    const selectedBtn = document.getElementById(`opt${selectedIndex}`);
    const isCorrect = selectedBtn.dataset.correct === "true";
    const q = currentQuestions[currentIndex];
    
    for (let i = 0; i < 4; i++) {
        const btn = document.getElementById(`opt${i}`);
        btn.disabled = true;
        
        btn.classList.add('disabled-option');
        
        if (btn.dataset.correct === "true") {
            btn.classList.remove('disabled-option');
            btn.classList.add('correct-choice');
        } 
        else if (i === selectedIndex && !isCorrect) {
            btn.classList.remove('disabled-option');
            btn.classList.add('wrong-choice');
        }
    }
    
    showFeedback(isCorrect, q.jp);
}

function checkInput() {
    const userAns = document.getElementById('user-input').value.trim().toLowerCase();
    const targetAns = currentQuestions[currentIndex].en.toLowerCase();
    const isCorrect = (userAns === targetAns);
    
    document.getElementById('user-input').disabled = true;
    document.getElementById('submit-input-btn').classList.add('is-hidden');
    
    showFeedback(isCorrect, currentQuestions[currentIndex].en);
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex < currentQuestions.length) {
        loadQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById('screen-quiz').classList.add('is-hidden');
    document.getElementById('screen-result').classList.remove('is-hidden');
    
    document.getElementById('score-text').innerText = `${score} / ${currentQuestions.length} 問正解`;

    let cheer = "";
    if (score === 10) {
        cheer = "パーフェクト！🎉\n電車のスキマ時間で天才になっちゃうね！";
    } else if (score >= 7) {
        cheer = "すごい！高得点！👏\nこの調子でどんどん復習しよう！";
    } else if (score >= 4) {
        cheer = "ナイストライ！👍\n繰り返しやれば絶対に覚えられるよ！";
    } else {
        cheer = "ファイト！継続が一番大事！💪\nもう一回チャレンジしてみよう！";
    }
    document.getElementById('cheer-message').innerText = cheer;
}
</script>
</body>
</html>
