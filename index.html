<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英単語マスター</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #F8FAFC;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #FFFFFF;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            box-sizing: border-box;
            min-height: 560px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        h1, h2 { text-align: center; color: #1E293B; margin-top: 0; }
        
        /* 基本ボタン（トップ・回答・次へ進む等：枠線なし） */
        .btn {
            background: linear-gradient(180deg, #334155 0%, #1E293B 100%); /* 落ち着いたダークグレー */
            color: white;
            border: none !important;
            padding: 16px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: bold;
            width: 100%;
            margin-bottom: 20px;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(30, 41, 59, 0.2);
            transition: all 0.2s ease;
        }
        .btn:active {
            transform: scale(0.98);
        }

        /* 4択ボタン（選択前も解答後の未選択ボタンと同じ色・文字色：背景#E2E8F0 / 文字#94A3B8） */
        .btn-option {
            background: #E2E8F0; 
            color: #94A3B8; /* 解答後未選択と同じ文字色 */
            text-align: left;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
            margin-bottom: 20px;
            line-height: 1.4;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-option:active {
            transform: scale(0.98);
        }

        /* 解答後：未選択の選択肢 */
        .btn-option.disabled-option {
            background: #E2E8F0 !important;
            color: #94A3B8 !important;
            box-shadow: none !important;
            border: none !important;
        }

        /* 正解のボタン（判定用緑枠のみ表示） */
        .btn-option.correct-choice {
            background: #F0FDF4 !important;
            color: #166534 !important;
            border: 3px solid #22C55E !important;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.15) !important;
        }

        /* 間違えたボタン（判定用赤枠のみ表示） */
        .btn-option.wrong-choice {
            background: #FEF2F2 !important;
            color: #991B1B !important;
            border: 3px solid #EF4444 !important;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.15) !important;
        }

        /* ヘッダー周り（進捗と中断ボタン） */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .btn-abort {
            background: #E2E8F0;
            color: #64748B;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-abort:active {
            background: #CBD5E1;
        }

        .word-display {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin: 15px 0 25px 0;
            color: #1E293B;
        }
        .hint-display {
            font-size: 22px;
            letter-spacing: 2px;
            color: #64748B;
            text-align: center;
            margin-bottom: 15px;
        }
        input[type="text"] {
            width: 100%;
            padding: 16px;
            font-size: 20px;
            border: 2px solid #E2E8F0;
            border-radius: 12px;
            box-sizing: border-box;
            margin-bottom: 20px;
            text-align: center;
        }
        select {
            border: 2px solid #E2E8F0 !important;
        }
        .progress {
            font-size: 15px;
            color: #94A3B8;
            font-weight: bold;
        }
        .result-msg {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            color: #1E293B;
            margin: 20px 0;
            white-space: pre-wrap;
        }

        /* 判定表示エリア */
        .feedback-area {
            text-align: center;
            padding: 15px;
            border-radius: 16px;
            margin-top: 10px;
        }
        .correct {
            background-color: #F0FDF4;
            color: #15803D;
            font-size: 22px;
            font-weight: bold;
        }
        .incorrect {
            background-color: #FEF2F2;
            color: #B91C1C;
            font-size: 18px;
            font-weight: bold;
        }
        .is-hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. 単元＆モード選択画面 -->
    <div id="screen-setup">
        <h1>英単語マスター</h1>
        <p style="text-align: center; color: #64748B; margin-bottom: 25px;">単元とモードを選んでね！</p>
        
        <label for="unit-select"><b>【単元を選択】</b></label>
        <select id="unit-select" style="width:100%; padding:14px; font-size:18px; margin: 10px 0 30px 0; border-radius:12px; background: #FFF;">
            <option value="unit1">単元 1：基本動詞・熟語</option>
            <option value="unit2">単元 2：頻出前置詞フレーズ</option>
        </select>

        <button class="btn" onclick="startQuiz('choice')">4択クイズモード</button>
        <button class="btn" style="background: linear-gradient(180deg, #475569 0%, #334155 100%); box-shadow: 0 6px 16px rgba(71, 85, 105, 0.2);" onclick="startQuiz('input')">スペル入力モード</button>
    </div>

    <!-- 2. クイズ画面 -->
    <div id="screen-quiz" class="is-hidden">
        <div>
            <div class="quiz-header">
                <div class="progress" id="quiz-progress">1 / 10</div>
                <button class="btn-abort" onclick="confirmAbort()">✕ 中断</button>
            </div>
            
            <div class="word-display" id="question-text">word</div>
            
            <!-- 4択モード用 -->
            <div id="choice-area">
                <button class="btn btn-option" onclick="checkChoice(0)" id="opt0"></button>
                <button class="btn btn-option" onclick="checkChoice(1)" id="opt1"></button>
                <button class="btn btn-option" onclick="checkChoice(2)" id="opt2"></button>
                <button class="btn btn-option" onclick="checkChoice(3)" id="opt3"></button>
            </div>

            <!-- スペル入力モード用 -->
            <div id="input-area" class="is-hidden">
                <div class="hint-display" id="hint-text">w _ _ _</div>
                <input type="text" id="user-input" placeholder="ここに入力..." autocomplete="off" autocapitalize="off">
                <button class="btn" id="submit-input-btn" onclick="checkInput()">回答する</button>
            </div>

            <!-- 判定表示エリア -->
            <div id="feedback-area" class="feedback-area is-hidden">
                <div id="feedback-text"></div>
                <button class="btn" style="margin-top: 15px; background: #334155; box-shadow: 0 4px 12px rgba(51, 65, 85, 0.2);" onclick="nextQuestion()">次へ進む ➔</button>
            </div>
        </div>
    </div>

    <!-- 3. 結果画面 -->
    <div id="screen-result" class="is-hidden">
        <h2>おつかれさま！</h2>
        <div class="word-display" id="score-text">10 / 10</div>
        <div class="result-msg" id="cheer-message">素晴らしい！完璧です！</div>
        <button class="btn" onclick="showSetup()">もう一度学習する</button>
    </div>
</div>

<script>
const wordBank = {
    unit1: [
        { en: "be surprised at", jp: "〜に驚く" },
        { en: "be good at", jp: "〜が得意だ" },
        { en: "look forward to", jp: "〜を楽しみに待つ" },
        { en: "take care of", jp: "〜の世話をする" },
        { en: "discover", jp: "を発見する" },
        { en: "improve", jp: "を向上させる" },
        { en: "provide", jp: "を供給する" },
        { en: "accept", jp: "を受け入れる" },
        { en: "avoid", jp: "を避ける" },
        { en: "continue", jp: "を続ける" }
    ],
    unit2: [
        { en: "according to", jp: "〜によれば" },
        { en: "because of", jp: "〜のために（理由）" },
        { en: "in front of", jp: "〜の前に" },
        { en: "instead of", jp: "〜の代わりに" },
        { en: "create", jp: "を創造する" },
        { en: "increase", jp: "が増加する" },
        { en: "reduce", jp: "を減らす" },
        { en: "suggest", jp: "を提案する" },
        { en: "require", jp: "を必要とする" },
        { en: "allow", jp: "を許可する" }
    ]
};

let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let currentMode = '';

function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}

function showSetup() {
    document.getElementById('screen-setup').classList.remove('is-hidden');
    document.getElementById('screen-quiz').classList.add('is-hidden');
    document.getElementById('screen-result').classList.add('is-hidden');
}

function confirmAbort() {
    if (confirm("学習を中断してトップ画面に戻りますか？")) {
        showSetup();
    }
}

function startQuiz(mode) {
    currentMode = mode;
    const selectedUnit = document.getElementById('unit-select').value;
    currentQuestions = shuffle([...wordBank[selectedUnit]]).slice(0, 10);
    currentIndex = 0;
    score = 0;

    document.getElementById('screen-setup').classList.add('is-hidden');
    document.getElementById('screen-quiz').classList.remove('is-hidden');

    loadQuestion();
}

function loadQuestion() {
    document.getElementById('feedback-area').classList.add('is-hidden');
    
    const q = currentQuestions[currentIndex];
    document.getElementById('quiz-progress').innerText = `${currentIndex + 1} / ${currentQuestions.length}`;

    if (currentMode === 'choice') {
        document.getElementById('choice-area').classList.remove('is-hidden');
        document.getElementById('input-area').classList.add('is-hidden');
        document.getElementById('question-text').innerText = q.en;
        
        const allWords = Object.values(wordBank).flat();
        const otherJps = allWords.filter(item => item.jp !== q.jp).map(item => item.jp);
        const wrongChoices = shuffle(otherJps).slice(0, 3);
        
        const options = shuffle([q.jp, ...wrongChoices]);
        for (let i = 0; i < 4; i++) {
            const btn = document.getElementById(`opt${i}`);
            btn.innerText = options[i];
            btn.disabled = false;
            btn.className = "btn btn-option";
            btn.dataset.correct = (options[i] === q.jp);
        }
    } else {
        document.getElementById('choice-area').classList.add('is-hidden');
        document.getElementById('input-area').classList.remove('is-hidden');
        document.getElementById('submit-input-btn').classList.remove('is-hidden');
        document.getElementById('question-text').innerText = q.jp;
        
        const hint = q.en.split(' ').map(word => {
            return word[0] + '_'.repeat(word.length - 1);
        }).join(' ');
        
        document.getElementById('hint-text').innerText = hint;
        document.getElementById('user-input').value = '';
        document.getElementById('user-input').disabled = false;
    }
}

function showFeedback(isCorrect, answerText) {
    const feedbackArea = document.getElementById('feedback-area');
    const feedbackText = document.getElementById('feedback-text');
    
    feedbackArea.classList.remove('is-hidden');
    
    if (isCorrect) {
        score++;
        feedbackArea.className = "feedback-area correct";
        feedbackText.innerText = "⭕ 正解！";
    } else {
        feedbackArea.className = "feedback-area incorrect";
        feedbackText.innerText = `❌ 残念...\n\n正解： ${answerText}`;
    }
}

function checkChoice(selectedIndex) {
    const selectedBtn = document.getElementById(`opt${selectedIndex}`);
    const isCorrect = selectedBtn.dataset.correct === "true";
    const q = currentQuestions[currentIndex];
    
    for (let i = 0; i < 4; i++) {
        const btn = document.getElementById(`opt${i}`);
        btn.disabled = true;
        
        btn.classList.add('disabled-option');
        
        if (btn.dataset.correct === "true") {
            btn.classList.remove('disabled-option');
            btn.classList.add('correct-choice');
        } 
        else if (i === selectedIndex && !isCorrect) {
            btn.classList.remove('disabled-option');
            btn.classList.add('wrong-choice');
        }
    }
    
    showFeedback(isCorrect, q.jp);
}

function checkInput() {
    const userAns = document.getElementById('user-input').value.trim().toLowerCase();
    const targetAns = currentQuestions[currentIndex].en.toLowerCase();
    const isCorrect = (userAns === targetAns);
    
    document.getElementById('user-input').disabled = true;
    document.getElementById('submit-input-btn').classList.add('is-hidden');
    
    showFeedback(isCorrect, currentQuestions[currentIndex].en);
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex < currentQuestions.length) {
        loadQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById('screen-quiz').classList.add('is-hidden');
    document.getElementById('screen-result').classList.remove('is-hidden');
    
    document.getElementById('score-text').innerText = `${score} / ${currentQuestions.length} 問正解`;

    let cheer = "";
    if (score === 10) {
        cheer = "パーフェクト！🎉\n電車のスキマ時間で天才になっちゃうね！";
    } else if (score >= 7) {
        cheer = "すごい！高得点！👏\nこの調子でどんどん復習しよう！";
    } else if (score >= 4) {
        cheer = "ナイストライ！👍\n繰り返しやれば絶対に覚えられるよ！";
    } else {
        cheer = "ファイト！継続が一番大事！💪\nもう一回チャレンジしてみよう！";
    }
    document.getElementById('cheer-message').innerText = cheer;
}
</script>
</body>
</html>
